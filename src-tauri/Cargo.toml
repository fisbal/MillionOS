[package]
name = "millionos"
version = "1.0.0"
description = "MillionOS for Windows and Mac: the same game in the system's web view"
authors = ["Martin Balla"]
license = ""
repository = "https://github.com/fisbal/MillionOS"
edition = "2021"
rust-version = "1.77"

[lib]
name = "millionos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
