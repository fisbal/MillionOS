<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MillionOS</title>
<meta name="description" content="MillionOS: bilingual naval knowledge challenge. Climb from Sailor to Admiral.">
<meta name="theme-color" content="#050a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html{height:100%}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>




<style>
/* Layout: a one-screen game console that always fits the window. Header on top; each screen fills the rest.
   Game: status · picture area (shrinks first) · question · answers · dock (lifelines, or confirm, or the learning note).
   Landscape / wide: rank ladder fills a right-hand column. Phone portrait: ladder lives in a drawer. Single dark naval look by design. */
:root{
  --abyss:#050a14; --hull:#0b1529; --steel:#16243f; --rivet:#24365a;
  --brass:#d6ab52; --brass-dim:#8d6e33; --foam:#eaf0f8; --mist:#8e9dba;
  --go:#35b07a; --stop:#d5534c;
  --f-display:"Saira Extra Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --gap:clamp(6px,1.4vh,12px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;background:var(--abyss);color:var(--foam);font-family:var(--f-body);font-size:15px;line-height:1.4;
  background-image:radial-gradient(ellipse 90% 60% at 50% 0%,#12244a 0%,transparent 70%),
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(214,171,82,.035) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(214,171,82,.035) 39px 40px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}

.wrap{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);
  padding-block:clamp(8px,1.6vh,14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.2vh,32px);letter-spacing:.02em;line-height:1}
.logo b{color:var(--brass);font-weight:800}
.chip{border:1px solid var(--rivet);background:var(--hull);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mist)}
.chip.on{border-color:var(--brass);color:var(--brass)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-dim)}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* shared */
.panel{background:linear-gradient(180deg,var(--hull),#081022);border:1px solid var(--rivet);border-radius:14px;padding:clamp(12px,2vh,16px);display:grid;gap:clamp(8px,1.4vh,12px);align-content:start}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,3vh,22px);margin:0;letter-spacing:.04em;text-transform:uppercase}
label{font-size:13px;color:var(--mist)}
input[type=text]{width:100%;background:var(--abyss);border:1px solid var(--rivet);border-radius:8px;padding:clamp(8px,1.5vh,12px);color:var(--foam);font-family:var(--f-mono);font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.cta{background:linear-gradient(180deg,#e7c06a,var(--brass));color:#1a1203;border:0;border-radius:10px;padding:clamp(9px,1.8vh,14px) 18px;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,3vh,22px);letter-spacing:.06em;text-transform:uppercase}
.cta:active{transform:translateY(1px)}
.ghost{background:transparent;border:1px solid var(--rivet);border-radius:10px;padding:10px 16px;color:var(--foam)}

/* start */
.start{display:grid;gap:var(--gap);grid-template-columns:1fr;align-content:start}
.colL,.colR{display:grid;gap:var(--gap);align-content:start;min-width:0}
.hero{display:grid;gap:6px;justify-items:center;text-align:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,min(8vw,7vh),56px);line-height:.95;margin:2px 0 0;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.hero h1 span{color:var(--brass)}
.hero p{margin:0;color:var(--mist);max-width:52ch;font-size:clamp(13px,2vh,15px)}
.rules{margin:0;padding-left:18px;color:var(--mist);display:grid;gap:4px;font-size:clamp(12px,1.8vh,14px)}
.rules b{color:var(--foam)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats span{font-size:12px;border:1px solid var(--rivet);border-radius:999px;padding:2px 10px;color:var(--mist)}
.honour{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.honour li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:baseline;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04)}
.honour .n{font-family:var(--f-mono);color:var(--brass-dim)}
.honour .who{font-family:var(--f-mono);letter-spacing:.06em;min-width:0;overflow-wrap:anywhere}
.honour .who small{display:block;font-family:var(--f-body);letter-spacing:0;color:var(--mist);font-size:12px}
.honour .p{font-family:var(--f-mono);color:var(--brass);font-variant-numeric:tabular-nums}
.honour li.gold{border-color:var(--brass-dim);background:rgba(214,171,82,.08)}
.empty{color:var(--mist);font-size:14px}
.disc{font-size:11px;color:var(--mist);text-align:center;max-width:90ch;margin:0 auto;grid-column:1/-1}
@media (min-width:760px),(min-width:520px) and (min-aspect-ratio:1/1){
  .start{grid-template-columns:1.15fr .85fr;align-items:start}
  .hero{justify-items:start;text-align:left}
}

@media (max-height:700px){
  .hero p,.disc{display:none}
  .cats span{font-size:11px;padding:1px 8px}
}
@media (max-height:560px){.cats,.hero .tag{display:none}}
/* game */
.game{display:grid;gap:var(--gap);grid-template-columns:1fr;overflow:hidden}
.stage{display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
.status{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rankNow{font-family:var(--f-display);font-size:clamp(15px,2.5vh,18px);letter-spacing:.04em;text-transform:uppercase;color:var(--mist)}
.rankNow b{color:var(--foam)}
.pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--brass);font-size:15px}
.viz{flex:1 1 0;min-height:70px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px}
.viz.pic{border:1px solid var(--rivet);background:radial-gradient(circle at 50% 40%,#1c3360,#08101f)}
.viz canvas{height:100%;max-height:160px;width:auto;aspect-ratio:1;max-width:100%}
.viz img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain}
.msg{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;background:rgba(11,21,41,.96);border:1px solid var(--rivet);border-left:3px solid var(--brass);border-radius:10px;padding:10px 12px;font-size:14px;max-height:calc(100% - 16px);overflow:auto}
@media(min-width:760px),(min-width:520px) and (min-aspect-ratio:1/1){.msg{left:auto;width:min(360px,calc(100% - 16px));top:8px;bottom:auto}}
.msg h3{margin:0 0 4px;font-family:var(--f-display);font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--brass)}
.msg .x{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--mist);font-size:18px;padding:2px 6px}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:20px 1fr 42px;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px}
.bar i{display:block;height:9px;border-radius:5px;background:var(--brass);min-width:2px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.qmeta{flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--brass-dim);text-transform:uppercase;text-align:center}
.qbox{flex:none;padding:clamp(10px,1.8vh,16px) 24px;text-align:center;background:linear-gradient(180deg,#14284d,#0a1630);border:1.5px solid var(--brass-dim);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);min-height:clamp(52px,9vh,84px);display:grid;place-items:center}
.qbox p{margin:0;font-size:clamp(16px,min(4.4vw,3vh),22px);font-weight:600;text-wrap:balance}
.answers{flex:none;display:grid;gap:clamp(6px,1.2vh,10px);grid-template-columns:1fr}
@media(min-width:620px){.answers{grid-template-columns:1fr 1fr}}
.answers.pics{grid-template-columns:1fr 1fr}
@media(min-width:760px),(min-width:520px) and (min-aspect-ratio:1/1){.answers.pics{grid-template-columns:repeat(4,1fr)}}
.ans{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 20px;min-height:clamp(40px,6.4vh,54px);background:linear-gradient(180deg,#132546,#0b1730);border:0;font-size:clamp(14px,2.2vh,16px);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);box-shadow:inset 0 0 0 1.5px var(--rivet);transition:background .2s}
.ans .k{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:20px;width:18px;flex:none}
.ans span:last-child{min-width:0}
.ans.pic{clip-path:none;border-radius:12px;justify-content:center;padding:8px;position:relative}
.ans.pic .k{position:absolute;top:4px;left:9px}
.ans.pic img{height:clamp(50px,11vh,112px);width:auto;max-width:100%;object-fit:contain;border-radius:4px}
.ans:hover:not(:disabled){background:linear-gradient(180deg,#1b3360,#0f1f40)}
.ans.sel{background:linear-gradient(180deg,#e7c06a,#b88b33);color:#1a1203}
.ans.sel .k{color:#1a1203}
.ans.ok{background:linear-gradient(180deg,#48c58d,#23875b);color:#04140c}
.ans.ok .k{color:#04140c}
.ans.bad{background:linear-gradient(180deg,#e2665f,#a8352f)}
.ans.gone{visibility:hidden}
.ans:disabled{cursor:default}
@media(prefers-reduced-motion:no-preference){.ans.sel{animation:pulse 1s ease-in-out infinite}.ans.ok{animation:flash .5s ease-in-out 3}}
@keyframes pulse{50%{filter:brightness(1.15)}}
@keyframes flash{50%{filter:brightness(1.4)}}
/* dock: one slot of fixed height, holding lifelines, the confirm bar, or the learning note */
.dock{flex:none;min-height:clamp(52px,8.5vh,70px);display:grid}
.lifes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.life{display:grid;gap:2px;justify-items:center;align-content:center;padding:4px;border-radius:12px;border:1px solid var(--brass-dim);background:radial-gradient(circle at 50% 30%,#1a2d55,#0a1530);font-size:clamp(10px,1.7vh,12px);line-height:1.15;text-align:center}
.life .ic{font-family:var(--f-display);font-weight:800;font-size:clamp(16px,2.8vh,20px);color:var(--brass);letter-spacing:.02em}
.life:disabled{opacity:.32;cursor:default;text-decoration:line-through}
.life.walk{border-color:var(--rivet);background:var(--hull)}
.life.walk .ic{color:var(--mist)}
.life.walk:disabled{text-decoration:none}
.confirm{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 10px;border:1px dashed var(--brass-dim);border-radius:10px}
.confirm p{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.confirm .cta{font-size:18px;padding:8px 16px}
.confirm .ghost{padding:8px 14px}
.learn{display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(53,176,122,.08);border:1px solid rgba(53,176,122,.35);border-radius:10px;padding:6px 14px;font-size:clamp(13px,2vh,15px)}
.learn b{color:var(--go)}
.learn.bad{background:rgba(213,83,76,.08);border-color:rgba(213,83,76,.4)}
.learn.bad b{color:var(--stop)}

.timer{flex:1 1 120px;max-width:260px;display:flex;align-items:center;gap:8px;--p:1}
.timer i{flex:1;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--brass) calc(var(--p)*100%),var(--rivet) 0);transition:background .3s}
.timer span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--brass);min-width:2ch;text-align:right}
.timer.warn i{background:linear-gradient(90deg,var(--stop) calc(var(--p)*100%),var(--rivet) 0)}
.timer.warn span{color:var(--stop)}
.learn{justify-content:space-between;text-align:left;gap:12px;flex-wrap:wrap}
.learn .lt{flex:1 1 260px;min-width:0;display:grid;gap:2px}
.learn p{margin:0}
.learn .why{color:var(--foam);opacity:.85;font-size:.92em}
.learn .cta{font-size:17px;padding:8px 16px;flex:none}
/* ladder */
.ladder{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column-reverse;gap:2px;background:linear-gradient(180deg,var(--hull),#081022);border:1px solid var(--rivet);border-radius:14px}
.ladder li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;font-size:13px;color:var(--mist)}
.ladder .q{font-family:var(--f-mono);font-size:11px}
.ladder .r{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladder .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ladder li.safe{color:var(--foam)}
.ladder li.safe .v{color:var(--brass)}
.ladder li.done{color:var(--brass-dim)}
.ladder li.cur{background:var(--brass);color:#1a1203}
.ladder li.cur .v{color:#1a1203}
.side{display:none;min-height:0}
@media(min-width:760px),(min-width:520px) and (min-aspect-ratio:1/1){
  .game{grid-template-columns:minmax(0,1fr) clamp(220px,26vw,290px)}
  .side{display:block}
  .side .ladder{height:100%}
  .side .ladder li{flex:1 1 0;min-height:0;padding-block:0;font-size:clamp(11px,1.8vh,13px)}
  .ladBtn{display:none}
}
.drawer{position:fixed;inset:0;background:rgba(2,5,12,.7);z-index:20;display:flex;justify-content:flex-end}
.drawer .in{width:min(320px,88vw);height:100%;overflow:auto;background:var(--abyss);border-left:1px solid var(--rivet);
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:10px;align-content:start}

/* end */
.end{display:flex;flex-direction:column;gap:var(--gap);align-items:center;justify-content:center;text-align:center}
.end h2{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,min(9vw,9vh),64px);margin:0;line-height:1;text-transform:uppercase}
.end .big{font-family:var(--f-mono);font-size:clamp(26px,min(7vw,6vh),44px);color:var(--brass);font-variant-numeric:tabular-nums}
.end p{margin:0;color:var(--mist);max-width:50ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">Million<b>OS</b></div>
    <div class="tools">
      <button class="chip" id="btnFull" type="button" aria-label="Full screen" title="Full screen">⛶</button>
      <button class="chip" id="btnMusic" type="button" aria-pressed="false"></button>
      <button class="chip" id="langEN" type="button">EN</button>
      <button class="chip" id="langFR" type="button">FR</button>
      <button class="chip ladBtn" id="ladBtn" type="button" hidden></button>
    </div>
  </header>

  <!-- START -->
  <section id="scrStart" class="screen start">
    <div class="colL">
      <div class="hero">
        <span class="tag" id="tStartTag"></span>
        <h1 id="tStartH"></h1>
        <p id="tStartP"></p>
      </div>
      <div class="panel">
        <h2 id="tEnlist"></h2>
        <label for="callsign" id="tCallLbl"></label>
        <input type="text" id="callsign" maxlength="16" autocomplete="off" placeholder="BOSUN-01">
        <button class="cta" id="btnStart" type="button"></button>
        <div class="cats" id="cats"></div>
      </div>
    </div>
    <div class="colR">
      <div class="panel">
        <h2 id="tHonour"></h2>
        <ol class="honour" id="honour"></ol>
      </div>
      <div class="panel">
        <h2 id="tRulesH"></h2>
        <ul class="rules" id="rules"></ul>
      </div>
    </div>
    <p class="disc" id="tDisc"></p>
  </section>

  <!-- GAME -->
  <section id="scrGame" class="screen game" hidden>
    <div class="stage">
      <div class="status">
        <div class="rankNow" id="rankNow"></div>
        <div class="timer" id="timer" hidden><i id="timerBar"></i><span id="timerN">30</span></div>
        <div class="pts" id="ptsNow"></div>
      </div>
      <div class="viz" id="viz">
        <canvas id="radar" width="260" height="260" aria-hidden="true"></canvas>
        <img id="qImg" alt="" hidden>
        <div class="msg" id="msg" hidden></div>
      </div>
      <div class="qmeta" id="qMeta"></div>
      <div class="qbox"><p id="qText"></p></div>
      <div class="answers" id="answers"></div>
      <div class="dock">
        <div class="lifes" id="lifes">
          <button class="life" id="lf50" type="button"><span class="ic">50:50</span><span id="tL50"></span></button>
          <button class="life" id="lfCall" type="button"><span class="ic">☎</span><span id="tLCall"></span></button>
          <button class="life" id="lfVote" type="button"><span class="ic">⚓</span><span id="tLVote"></span></button>
          <button class="life" id="lfSwap" type="button"><span class="ic">⇄</span><span id="tLSwap"></span></button>
          <button class="life walk" id="btnWalk" type="button"><span class="ic">⚑</span><span id="tWalk"></span></button>
        </div>
        <div class="confirm" id="confirm" hidden>
          <p id="tFinal"></p>
          <button class="cta" id="btnLock" type="button"></button>
          <button class="ghost" id="btnCancel" type="button"></button>
        </div>
        <div class="learn" id="learn" hidden></div>
      </div>
    </div>
    <aside class="side"><ol class="ladder" id="ladderSide"></ol></aside>
  </section>

  <!-- END -->
  <section id="scrEnd" class="screen end" hidden>
    <span class="tag" id="endTag"></span>
    <h2 id="endH"></h2>
    <div class="big" id="endPts"></div>
    <p id="endP"></p>
    <div class="row">
      <button class="cta" id="btnAgain" type="button"></button>
      <button class="ghost" id="btnHome" type="button"></button>
    </div>
  </section>
</div>

<div class="drawer" id="drawer" hidden><div class="in"><h2 class="tag" id="tLadder"></h2><ol class="ladder" id="ladderDrawer"></ol><button class="ghost" id="btnCloseDrawer" type="button"></button></div></div>

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("mos_lang","en");

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Question bank ----------
   A question: {lv, q:[en,fr] or fn(lang)→string, a:[answer×4] (correct first), img?, wide?}
   An answer is [en,fr] text, or {img:key} for an insignia tile. */
function near(list,self,n){
  // up to n entries closest in seniority to self, then shuffled — harder distractors than random ones
  return shuffle(list.filter(x=>x!==self).sort((a,b)=>Math.abs(a[2]-self[2])-Math.abs(b[2]-self[2])+Math.random()*0.5).slice(0,n+1)).slice(0,n);
}
function buildBank(){
  const B=TQ.map(([lv,en,fr],i)=>({lv,q:[en[0],fr[0]],a:en[1].map((x,j)=>[x,fr[1][j]]),exp:EXP[i]}));
  const withImg=RANKS.filter(r=>r[7]);
  RANKS.forEach(r=>{
    const grp=RANKS.filter(x=>x[1]===r[1]);
    if(r[7]){
      // A: identify the rank from its sleeve insignia
      const ex=[`${r[3]}: ${LOOK[r[0]][0]}`,`${r[4]} : ${LOOK[r[0]][1]}`];
      B.push({lv:r[9],kind:"rank",img:r[7],q:"qRankImg",exp:ex,a:[r,...near(grp,r,3)].map(x=>[x[3],x[4]])});
      // B: pick the right insignia among four
      const g2=withImg.filter(x=>x[1]===r[1]);
      B.push({lv:Math.min(3,r[9]+1),kind:"rank",q:["qImgOf",r],exp:ex,a:[r,...near(g2,r,3)].map(x=>({img:x[7]}))});
    }
    if(r[8]) B.push({lv:3,kind:"rank",img:r[8],q:"qRankBoard",exp:[`${r[3]}: ${LOOK[r[0]][0]}`,`${r[4]} : ${LOOK[r[0]][1]}`],a:[r,...near(grp.filter(x=>x[8]||x[2]>=5),r,3)].map(x=>[x[3],x[4]])});
    // C: Army equivalent
    B.push({lv:r[9]===1?2:r[9],kind:"rank",q:["qArmy",r],exp:[`Navy ${r[3]} = Army ${r[5]}.`,`${r[4]} (Marine) = ${r[6]} (Armée).`],a:[r,...near(grp,r,3)].map(x=>[x[5],x[6]])});
  });
  SHIPS.forEach(s=>B.push({lv:2,kind:"ship",img:s[0],q:"qShip",exp:SHIPCAP[s[0]],a:[s,...shuffle(SHIPS.filter(x=>x!==s)).slice(0,3)].map(x=>[x[1],x[2]])}));
  B.push({lv:3,kind:"ship",img:"ship-halifax-gun",q:"qGun",a:"gun",exp:["Halifax-class frigates carry a 57 mm gun on the foredeck.","Les frégates de classe Halifax portent un canon de 57 mm sur le pont avant."]});
  BADGES.forEach(b=>B.push({lv:3,kind:"badge",img:b[0],q:"qBadge",exp:[`${b[1]}, a Halifax-class frigate: her badge shows ${EMBLEM[b[0]][0]}.`,`${b[2]}, frégate de classe Halifax : son insigne montre ${EMBLEM[b[0]][1]}.`],a:[b,...shuffle(BADGES.filter(x=>x!==b&&x[0]!==LOOKALIKE[b[0]])).slice(0,3)].map(x=>[x[1],x[2]])}));
  return B.filter(q=>(!q.img||IMG[q.img])&&(!Array.isArray(q.a)||q.a.every(x=>!x.img||IMG[x.img])));
}
const BANK=buildBank();
function qText(q){
  const t=L();
  if(typeof q.q==="string")return t[q.q];
  if(typeof q.q[0]==="string"&&q.q.length===2&&typeof q.q[1]==="string"&&!t[q.q[0]])return q.q[LI()];
  const [key,r]=q.q;return t[key](r[3+LI()]);
}
function answers(q){return q.a==="gun"?L().gun.map(x=>[x,x]):q.a}
function explain(q){return q.exp?q.exp[LI()]:""}
function ansText(a){return a.img?L().insignia:a[LI()]}

/* ---------- Game ---------- */
let G=null;
function newGame(){
  Sound.start();
  const pick=lv=>{
    // mix question kinds so a game isn't all insignia
    const p=shuffle(BANK.filter(q=>q.lv===lv)),out=[],count={};
    for(const q of p){const k=q.kind||"text";if((count[k]||0)>=(k==="text"?3:2)&&p.length-out.length>6)continue;count[k]=(count[k]||0)+1;out.push(q)}
    return out.concat(p.filter(q=>!out.includes(q)));
  };
  const pools={1:pick(1),2:pick(2),3:pick(3)};
  const seq=[...pools[1].splice(0,5),...pools[2].splice(0,5),...pools[3].splice(0,5)];
  G={name:($("callsign").value.trim()||"BOSUN-01").toUpperCase(),seq,pools,i:0,order:null,hidden:new Set(),sel:null,locked:false,
     used:{f:false,c:false,v:false,s:false}};
  store.set("mos_name",G.name);
  show("scrGame");loadQ();
}
function loadQ(){stopTimer();G.order=shuffle([0,1,2,3]);G.hidden=new Set();G.sel=null;G.locked=false;$("msg").hidden=true;$("learn").hidden=true;Sound.level(G.i);renderGame();startTimer()}
const curQ=()=>G.seq[G.i];

function renderGame(){
  const q=curQ(),t=L(),A=answers(q);
  $("rankNow").innerHTML=`${t.now}: <b>${esc(rankName(G.i-1))}</b>`;
  $("ptsNow").textContent=`${fmt(G.i?LADDER[G.i-1][0]:0)} ${t.pts}`;
  $("qMeta").textContent=`${t.q} ${G.i+1} ${t.of} 15 · ${t.level[q.lv]} · ${fmt(LADDER[G.i][0])} ${t.pts}`;
  $("qText").textContent=qText(q);
  const hasImg=!!q.img;$("radar").hidden=hasImg;$("qImg").hidden=!hasImg;$("viz").classList.toggle("pic",hasImg);
  if(hasImg&&$("qImg").getAttribute("data-k")!==q.img){$("qImg").src=IMG[q.img];$("qImg").setAttribute("data-k",q.img)}
  const pics=!!A[0].img;const box=$("answers");box.innerHTML="";box.classList.toggle("pics",pics);
  G.order.forEach((orig,pos)=>{
    const a=A[orig],b=document.createElement("button");b.type="button";b.className="ans"+(pics?" pic":"");b.id="ans"+pos;
    if(pics){b.innerHTML=`<span class="k">${"ABCD"[pos]}</span><img alt="">`;b.querySelector("img").src=IMG[a.img];b.setAttribute("aria-label",`${"ABCD"[pos]}: ${t.insignia}`)}
    else{b.innerHTML=`<span class="k">${"ABCD"[pos]}</span><span></span>`;b.lastChild.textContent=a[LI()]}
    if(G.hidden.has(orig))b.classList.add("gone");
    if(G.sel===pos)b.classList.add("sel");
    b.disabled=G.locked;b.onclick=()=>pick(pos);box.appendChild(b);
  });
  $("confirm").hidden=G.sel==null||G.locked;
  $("lifes").hidden=!$("confirm").hidden||!$("learn").hidden;
  $("tFinal").textContent=t.final;$("btnLock").textContent=t.lock;$("btnCancel").textContent=t.cancel;
  $("lf50").disabled=G.used.f||G.locked;$("lfCall").disabled=G.used.c||G.locked;$("lfVote").disabled=G.used.v||G.locked;$("lfSwap").disabled=G.used.s||G.locked||!G.pools[q.lv].length;
  $("tWalk").innerHTML=`${t.walkShort}<br>${fmt(G.i?LADDER[G.i-1][0]:0)}`;$("btnWalk").disabled=G.locked;$("btnWalk").title=`${t.walk} ${fmt(G.i?LADDER[G.i-1][0]:0)} ${t.pts}`;
  $("ladBtn").textContent=t.ladder;
  renderLadder();
}
function renderLadder(){
  const html=LADDER.map((r,i)=>{
    let c=SAFE.includes(i)?"safe":"";if(G&&i<G.i)c+=" done";if(G&&i===G.i)c+=" cur";
    return `<li class="${c}"><span class="q">${i+1}</span><span class="r">${r[lang==="fr"?2:1]}</span><span class="v">${fmt(r[0])}</span></li>`}).join("");
  $("ladderSide").innerHTML=html;$("ladderDrawer").innerHTML=html;
}
function pick(pos){if(G.locked)return;G.sel=pos;Sound.sfx("tick");renderGame();$("confirm").scrollIntoView({block:"nearest",behavior:"smooth"})}

function lockIn(){
  if(G.locked||G.sel==null)return;
  stopTimer();G.locked=true;renderGame();Sound.sfx("lock");Sound.hush(true);
  $("ans"+G.sel).classList.add("sel");
  const ok=G.sel===G.order.indexOf(0);
  setTimeout(()=>reveal(ok?"right":"wrong"),1500);
}
function reveal(res){
  const q=curQ(),A=answers(q),t=L(),cp=G.order.indexOf(0);
  const good=$("ans"+cp);good.classList.remove("sel");good.classList.add("ok");
  if(res==="wrong"){const b=$("ans"+G.sel);b.classList.remove("sel");b.classList.add("bad")}
  Sound.sfx(res==="right"?"right":"wrong");Sound.hush(false);
  const head=res==="right"?t.right:res==="time"?t.timeUp:t.wrong;
  const rightTxt=A[0].img?"ABCD"[cp]:esc(A[0][LI()]);
  const label=res!=="right"?t.seeResult:G.i===14?t.claim:t.next;
  const box=$("learn");box.className="learn"+(res==="right"?"":" bad");
  box.innerHTML=`<div class="lt"><p><b>${head}</b> ${t.isAns} <b>${rightTxt}</b>.</p>${explain(q)?`<p class="why">${esc(explain(q))}</p>`:""}</div><button class="cta" id="btnNext" type="button">${label}</button>`;
  box.hidden=false;$("lifes").hidden=true;$("msg").hidden=true;
  const nb=$("btnNext");nb.onclick=()=>{nb.disabled=true;if(res==="right"){G.i++;if(G.i===15)finish("win");else loadQ()}else finish("lost")};
  try{nb.focus({preventScroll:true})}catch(e){}
}
/* 30-second timer from question 6 on */
function startTimer(){
  stopTimer();const el=$("timer");
  if(!G||G.i<5){el.hidden=true;return}
  G.left=30;el.hidden=false;drawTimer();
  G.tid=setInterval(()=>{
    G.left--;drawTimer();
    if(G.left>0&&G.left<=5)Sound.sfx("tick");
    if(G.left<=0){stopTimer();timeUp()}
  },1000);
}
function stopTimer(){if(G&&G.tid){clearInterval(G.tid);G.tid=null}}
function drawTimer(){const el=$("timer");el.style.setProperty("--p",String(Math.max(0,G.left)/30));$("timerN").textContent=String(Math.max(0,G.left));el.classList.toggle("warn",G.left<=10)}
function timeUp(){if(G.locked)return;G.locked=true;G.sel=null;renderGame();reveal("time")}

function finish(kind){
  stopTimer();$("timer").hidden=true;
  const t=L();let idx;
  if(kind==="win")idx=14;
  else if(kind==="walk")idx=G.i-1;
  else idx=G.i>SAFE[1]?SAFE[1]:G.i>SAFE[0]?SAFE[0]:-1;
  const pts=idx<0?0:LADDER[idx][0];
  let correctTxt="";
  if(kind==="lost"){const A=answers(curQ());correctTxt=A[0].img?`${"ABCD"[G.order.indexOf(0)]} (${t.insignia})`:A[0][LI()]}
  $("endTag").textContent=t[kind+"Tag"];$("endH").textContent=t[kind+"H"];
  $("endPts").textContent=`${fmt(pts)} ${t.pts}`;
  $("endP").textContent=kind==="win"?t.winP:kind==="walk"?t.walkP(rankName(idx)):t.lostP(correctTxt,rankName(idx));
  if(pts>0)saveHonour(G.name,pts,idx);
  Sound.sfx(kind==="win"?"fanfare":kind==="lost"?"sink":"tick");Sound.level(kind==="win"?14:0);
  show("scrEnd");
}
function saveHonour(name,pts,idx){
  const list=store.get("mos_honour",[]);list.push({name,pts,idx,d:new Date().toISOString().slice(0,10)});
  list.sort((a,b)=>b.pts-a.pts);store.set("mos_honour",list.slice(0,10));
}
function renderHonour(){
  const list=store.get("mos_honour",[]),ol=$("honour");
  if(!list.length){ol.innerHTML=`<li class="empty" style="display:block">${L().emptyH}</li>`;return}
  ol.innerHTML=list.map((h,i)=>`<li class="${h.pts>=1000000?"gold":""}"><span class="n">${i+1}</span><span class="who"></span><span class="p">${fmt(h.pts)}</span></li>`).join("");
  [...ol.querySelectorAll(".who")].forEach((el,i)=>{const h=list[i];el.textContent=h.name;const s=document.createElement("small");s.textContent=`${rankName(h.idx)} · ${h.d}`;el.appendChild(s)});
}

/* ---------- Lifelines ---------- */
function msg(title,html){const m=$("msg");m.innerHTML=`<button class="x" type="button" aria-label="Close">×</button><h3></h3>${html}`;m.querySelector("h3").textContent=title;m.querySelector(".x").onclick=()=>{m.hidden=true};m.hidden=false}
const visibleOrig=()=>[0,1,2,3].filter(o=>!G.hidden.has(o));
function fifty(){
  G.used.f=true;Sound.sfx("tick");const wrong=shuffle([1,2,3].filter(o=>!G.hidden.has(o)));
  wrong.slice(0,Math.max(0,wrong.length-1)).forEach(o=>G.hidden.add(o));
  if(G.sel!=null&&G.hidden.has(G.order[G.sel]))G.sel=null;
  renderGame();msg(L().fiftyH,`<p style="margin:0">${L().fiftyP}</p>`);
}
function call(){
  G.used.c=true;Sound.sfx("tick");const q=curQ(),lv=q.lv,acc=[0,.92,.75,.55][lv],vis=visibleOrig();
  const right=Math.random()<acc;const o=right?0:(shuffle(vis.filter(x=>x!==0))[0]??0);
  const t=L(),a=answers(q)[o],pos=G.order.indexOf(o);
  const lead=right?(lv===1?t.callSure:t.callThink):(lv===3?t.callGuess:t.callThink);
  renderGame();msg(t.callH,`<p style="margin:0">“${lead} <b>${"ABCD"[pos]}</b>${a.img?"":" — "+esc(a[LI()])}.”</p>`);
}
function vote(){
  G.used.v=true;Sound.sfx("tick");const lv=curQ().lv,vis=visibleOrig();
  const base=[0,[58,82],[42,64],[30,50]][lv];let c=base[0]+Math.random()*(base[1]-base[0]);
  if(vis.length===2)c=Math.min(92,c+15);
  const others=vis.filter(o=>o!==0),w=others.map(()=>Math.random()+.2),ws=w.reduce((a,b)=>a+b,0);
  const pct={0:c};others.forEach((o,i)=>pct[o]=(100-c)*w[i]/ws);
  const r={};let tot=0;vis.forEach(o=>{r[o]=Math.round(pct[o]);tot+=r[o]});r[0]+=100-tot;
  const rows=G.order.map((o,pos)=>vis.includes(o)?`<div class="bar"><span>${"ABCD"[pos]}</span><i style="width:${r[o]}%"></i><em>${r[o]}%</em></div>`:"").join("");
  renderGame();msg(L().voteH,`<div class="bars">${rows}</div>`);
}
function swap(){
  const pool=G.pools[curQ().lv];if(!pool.length)return;
  G.used.s=true;Sound.sfx("tick");G.seq[G.i]=pool.shift();loadQ();msg(L().swapH,`<p style="margin:0">${L().swapP}</p>`);
}

/* ---------- Original soundtrack (Web Audio, nothing sampled) ----------
   A slow minor-key pad with a pulse that speeds up and brightens as you climb the ranks. */
const Sound=(()=>{
  let ctx=null,master=null,musicBus=null,sfxBus=null,filter=null,timer=null,step=0,lvl=0,on=store.get("mos_music",true);
  const CH=[[50,57,62,65],[46,53,58,62],[41,48,53,57],[48,55,60,64]]; // Dm  Bb  F  C (MIDI)
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return true;
    try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=900;filter.Q.value=.7;
    musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(filter);filter.connect(master);
    sfxBus=ctx.createGain();sfxBus.gain.value=.5;sfxBus.connect(master);
    return true;
  }
  function tone(f,t,d,type,g,bus,attack=.02){
    const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.value=f;
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+attack);v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(v);v.connect(bus);o.start(t);o.stop(t+d+.05);
  }
  function beatLen(){return .52-lvl*.017} // ~115 → 180 bpm feel
  function tick(){
    const t=ctx.currentTime+.05,b=beatLen(),bar=Math.floor(step/8)%4,ch=CH[bar],s=step%8;
    if(s===0){ch.forEach((m,i)=>{tone(hz(m),t,b*8.2,"triangle",.045,musicBus,.6);tone(hz(m)*1.005,t,b*8.2,"sawtooth",.012,musicBus,.8)});tone(hz(ch[0]-12),t,b*7.5,"sine",.16,musicBus,.05)}
    // heartbeat pulse
    if(s%2===0)tone(hz(ch[0]-24),t,.22,"sine",s===0?.28:.16,musicBus,.005);
    // sparkling arpeggio appears from the officer ranks up
    if(lvl>=7&&s%2===1)tone(hz(ch[(s>>1)%4]+12),t,b*1.4,"sine",.03+lvl*.002,musicBus,.01);
    // tension ticks near the top
    if(lvl>=11)tone(2400,t,.03,"square",.012,musicBus,.001);
    step++;timer=setTimeout(tick,b*1000);
  }
  function startLoop(){if(timer||!on)return;musicBus.gain.cancelScheduledValues(ctx.currentTime);musicBus.gain.setTargetAtTime(1,ctx.currentTime,.8);tick()}
  function stopLoop(){clearTimeout(timer);timer=null;if(musicBus)musicBus.gain.setTargetAtTime(0,ctx.currentTime,.3)}
  return{
    get on(){return on},
    start(){if(!init())return;if(ctx.state==="suspended")ctx.resume();if(on)startLoop()},
    toggle(){on=!on;store.set("mos_music",on);if(on){this.start()}else stopLoop();return on},
    level(i){lvl=i;if(filter&&ctx)filter.frequency.setTargetAtTime(900+i*180,ctx.currentTime,.5)},
    hush(h){if(musicBus&&timer)musicBus.gain.setTargetAtTime(h?.25:1,ctx.currentTime,.25)},
    sfx(kind){
      if(!init())return;if(ctx.state==="suspended")ctx.resume();const t=ctx.currentTime+.01;
      if(kind==="tick")tone(880,t,.12,"triangle",.25,sfxBus,.005);
      if(kind==="lock"){tone(hz(38),t,1.2,"sawtooth",.18,sfxBus,.01);tone(hz(50),t,1.2,"triangle",.2,sfxBus,.01)}
      if(kind==="right")[62,66,69,74].forEach((m,i)=>tone(hz(m),t+i*.09,.6,"triangle",.28,sfxBus,.01));
      if(kind==="wrong"){tone(hz(46),t,.9,"sawtooth",.25,sfxBus,.01);tone(hz(45),t+.05,.9,"sawtooth",.2,sfxBus,.01)}
      if(kind==="sink")[57,53,50,45].forEach((m,i)=>tone(hz(m),t+i*.22,.8,"triangle",.22,sfxBus,.01));
      if(kind==="fanfare")[[62,0],[66,.18],[69,.36],[74,.54],[69,.8],[74,.98],[78,1.16]].forEach(([m,d])=>{tone(hz(m),t+d,.7,"sawtooth",.12,sfxBus,.01);tone(hz(m),t+d,.7,"triangle",.2,sfxBus,.01)});
    }
  };
})();

/* ---------- Screens & language ---------- */
function show(id){["scrStart","scrGame","scrEnd"].forEach(s=>$(s).hidden=s!==id);$("ladBtn").hidden=id!=="scrGame";$("drawer").hidden=true;if(id==="scrStart")renderHonour();$(id).scrollTop=0}
function musicLabel(){$("btnMusic").textContent=L().music;$("btnMusic").classList.toggle("on",Sound.on);$("btnMusic").setAttribute("aria-pressed",String(Sound.on))}
function applyLang(){
  const t=L();document.documentElement.lang=lang;
  $("langEN").classList.toggle("on",lang==="en");$("langFR").classList.toggle("on",lang==="fr");
  $("tStartTag").textContent=t.startTag;$("tStartH").innerHTML=t.startH;$("tStartP").textContent=t.startP;
  $("tEnlist").textContent=t.enlist;$("tCallLbl").textContent=t.callLbl;$("btnStart").textContent=t.start;
  $("cats").innerHTML=t.cats.map(c=>`<span>${c}</span>`).join("");
  $("rules").innerHTML=t.rules.map(r=>`<li>${r}</li>`).join("");
  $("tHonour").textContent=t.honour;$("tRulesH").textContent=t.rulesH;$("tDisc").textContent=t.disc;
  $("tL50").textContent=t.l50;$("tLCall").textContent=t.lCall;$("tLVote").textContent=t.lVote;$("tLSwap").textContent=t.lSwap;
  $("btnAgain").textContent=t.again;$("btnHome").textContent=t.home;$("tLadder").textContent=t.ladder;$("btnCloseDrawer").textContent=t.close;
  musicLabel();renderHonour();
  if(G&&!$("scrGame").hidden){$("msg").hidden=true;renderGame()}else renderLadder();
}
$("langEN").onclick=()=>{lang="en";store.set("mos_lang",lang);applyLang()};
$("langFR").onclick=()=>{lang="fr";store.set("mos_lang",lang);applyLang()};
(function(){
  const b=$("btnFull"),d=document,ok=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!ok){b.hidden=true;return}
  b.onclick=()=>{try{
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{const r=(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement);if(r&&r.catch)r.catch(()=>{b.hidden=true})}
  }catch(e){b.hidden=true}};
})();
$("btnMusic").onclick=()=>{Sound.toggle();musicLabel()};
$("btnStart").onclick=newGame;$("btnAgain").onclick=newGame;$("btnHome").onclick=()=>show("scrStart");

/* Radar emblem (original artwork: brass compass rose with a sonar sweep) */
(function(){
  const cv=$("radar"),x=cv.getContext("2d"),W=260,C=130,R=122,still=matchMedia("(prefers-reduced-motion: reduce)").matches;let a=0;
  function draw(){
    x.clearRect(0,0,W,W);
    const g=x.createRadialGradient(C,C,10,C,C,R);g.addColorStop(0,"#1c3566");g.addColorStop(1,"#070e1e");
    x.fillStyle=g;x.beginPath();x.arc(C,C,R,0,7);x.fill();
    x.strokeStyle="#d6ab52";x.lineWidth=4;x.beginPath();x.arc(C,C,R,0,7);x.stroke();
    x.lineWidth=1;x.strokeStyle="rgba(214,171,82,.35)";[96,70,44].forEach(r=>{x.beginPath();x.arc(C,C,r,0,7);x.stroke()});
    for(let i=0;i<72;i++){const t=i/72*Math.PI*2,l=i%9===0?12:5;x.beginPath();x.moveTo(C+Math.cos(t)*(R-6),C+Math.sin(t)*(R-6));x.lineTo(C+Math.cos(t)*(R-6-l),C+Math.sin(t)*(R-6-l));x.stroke()}
    x.save();x.translate(C,C);x.rotate(a);
    const s=x.createLinearGradient(0,0,112,0);s.addColorStop(0,"rgba(214,171,82,0)");s.addColorStop(1,"rgba(214,171,82,.45)");
    x.fillStyle=s;x.beginPath();x.moveTo(0,0);x.arc(0,0,112,-0.5,0);x.closePath();x.fill();x.restore();
    x.fillStyle="#d6ab52";
    for(let i=0;i<4;i++){const t=i*Math.PI/2;x.beginPath();x.moveTo(C+Math.cos(t)*86,C+Math.sin(t)*86);x.lineTo(C+Math.cos(t+.5)*19,C+Math.sin(t+.5)*19);x.lineTo(C,C);x.lineTo(C+Math.cos(t-.5)*19,C+Math.sin(t-.5)*19);x.closePath();x.fill()}
    x.fillStyle="#eaf0f8";for(let i=0;i<4;i++){const t=i*Math.PI/2+Math.PI/4;x.beginPath();x.moveTo(C+Math.cos(t)*52,C+Math.sin(t)*52);x.lineTo(C+Math.cos(t+.6)*12,C+Math.sin(t+.6)*12);x.lineTo(C,C);x.lineTo(C+Math.cos(t-.6)*12,C+Math.sin(t-.6)*12);x.closePath();x.fill()}
    x.fillStyle="#070e1e";x.beginPath();x.arc(C,C,8,0,7);x.fill();x.strokeStyle="#d6ab52";x.lineWidth=2;x.stroke();
    a+=still?.008:.025;requestAnimationFrame(draw) // reduced-motion setting: slower sweep instead of a frozen radar
  }
  draw();
})();

applyLang();show("scrStart");
